{% set name = "nllocpy" %}
{% set version = "0.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - nllgrid
    - pdfkit
    - ipykernel

test:
  imports:
    - NllocPy

about:
  home: https://github.com/YOUR_USERNAME/NllocPy
  license: MIT
  license_file: LICENSE
  summary: Python wrapper for NonLinLoc
