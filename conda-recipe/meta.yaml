# DEVELOPMENT POLICY (see README.md):
# Current NllocPy installations must use python -m pip install -e .
# inside an isolated environment. This recipe produces a NON-EDITABLE
# distribution package and is retained only for potential future releases.
# Do NOT use conda build/install as the current development installation.

{% set name = "nllocpy" %}
{% set version = "0.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python >=3.8
    - pip
    - setuptools
  run:
    - python >=3.8
    - numpy >=1.23
    - pdfkit
    - ipykernel

test:
  imports:
    - NllocPy

about:
  home: https://github.com/ZLS92/NllocPy
  license: MIT
  license_file: LICENSE
  summary: Python wrapper for NonLinLoc
